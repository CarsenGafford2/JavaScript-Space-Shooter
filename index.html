<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel FPS Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <h1>Voxel FPS Shooter</h1>
        <div id="instructions">
            <h2>Controls:</h2>
            <ul>
                <li><strong>WASD</strong> - Move</li>
                <li><strong>Mouse</strong> - Look around</li>
                <li><strong>Left Click</strong> - Shoot</li>
                <li><strong>Space</strong> - Jump</li>
                <li><strong>ESC</strong> - Pause</li>
            </ul>
            <button id="startButton">Click to Start</button>
        </div>
    </div>
    <div id="hud" style="display: none;">
        <div id="crosshair"></div>
        <div id="stats">
            <div id="health">Health: <span id="healthValue">100</span></div>
            <div id="score">Score: <span id="scoreValue">0</span></div>
            <div id="ammo">Ammo: <span id="ammoValue">∞</span></div>
        </div>
    </div>
    <div id="gameOver" style="display: none;">
        <h1>Game Over!</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartButton">Restart</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
